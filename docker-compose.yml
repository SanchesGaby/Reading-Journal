services:
  backend:
    build:
      context: ./backend/ReadingJournal.Api
    container_name: reading-journal-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Cors__AllowedOrigins__0: http://localhost:5173
      Cors__AllowedOrigins__1: http://localhost:3000
      Cors__AllowedOrigins__2: http://localhost
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080/api
    container_name: reading-journal-web
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  uploads_data:
